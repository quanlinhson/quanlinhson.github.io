<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Match Settings</title>
</head>

<body>
    <div class="settings-container">
        <div class="settings-header">
            <h2>⚙ Match Settings</h2>
            <button type="button" id="close-settings" class="close-btn" title="Close">✕</button>
        </div>

        <div class="settings-card">
            <h3>Team Names</h3>
            <div class="input-group team-inputs">
                <div class="team-input-wrap blue-team">
                    <span class="team-badge">T1</span>
                    <input type="text" id="team1-name-input" placeholder="Team 1 Name">
                </div>
                <div class="team-input-wrap red-team">
                    <span class="team-badge">T2</span>
                    <input type="text" id="team2-name-input" placeholder="Team 2 Name">
                </div>
            </div>
        </div>

        <div class="settings-card">
            <h3>Match Scores</h3>
            <div class="scores-group">
                <div class="score-stepper blue-team">
                    <label>Team 1</label>
                    <div class="stepper-wrap">
                        <button type="button" class="step-btn" data-target="team1-score-input" data-dir="-1">−</button>
                        <input type="number" id="team1-score-input" min="0" max="99" value="0">
                        <button type="button" class="step-btn" data-target="team1-score-input" data-dir="1">+</button>
                    </div>
                </div>
                <div class="score-separator">-</div>
                <div class="score-stepper red-team">
                    <label>Team 2</label>
                    <div class="stepper-wrap">
                        <button type="button" class="step-btn" data-target="team2-score-input" data-dir="-1">−</button>
                        <input type="number" id="team2-score-input" min="0" max="99" value="0">
                        <button type="button" class="step-btn" data-target="team2-score-input" data-dir="1">+</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="settings-card">
            <div class="card-header-row">
                <h3>Timers (Seconds)</h3>
                <div class="timer-presets">
                    <button type="button" class="preset-btn" data-ban="15" data-pick="30">Blitz (15/30s)</button>
                    <button type="button" class="preset-btn" data-ban="30" data-pick="60">Standard (30/60s)</button>
                    <button type="button" class="preset-btn" data-ban="45" data-pick="90">Deep (45/90s)</button>
                </div>
            </div>
            <div class="timers-inputs">
                <div class="timer-item">
                    <label for="ban-time-setting">Ban Phase</label>
                    <input type="number" id="ban-time-setting" min="5" max="120" step="5" value="30">
                </div>
                <div class="timer-item">
                    <label for="pick-time-setting">Pick Phase</label>
                    <input type="number" id="pick-time-setting" min="5" max="180" step="5" value="60">
                </div>
            </div>
        </div>

        <div class="settings-card">
            <h3>HUD Layout Mode</h3>
            <div class="layout-toggle-group">
                <button type="button" class="layout-btn" data-value="classic">
                    <span class="layout-icon icon-vertical"></span>
                    <span class="layout-text">Vertical (Player)</span>
                </button>
                <button type="button" class="layout-btn" data-value="broadcast">
                    <span class="layout-icon icon-horizontal"></span>
                    <span class="layout-text">Horizontal (Broadcast)</span>
                </button>
                <input type="hidden" id="hud-layout-setting" value="classic">
            </div>
        </div>

        <div class="settings-actions">
            <button type="button" id="reset-settings" class="secondary-btn">Reset Defaults</button>
            <button type="button" id="save-settings" class="save-button">Save Settings</button>
        </div>
    </div>
    <script src="settings.js"></script>
</body>

</html>
